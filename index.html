<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="side-top">
      <button class="icon-btn" id="closeSide" aria-label="Fermer le menu"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button class="new-chat-btn" id="newChat"><svg class="ic"><use href="#i-plus"/></svg><span>Nouvelle discussion</span></button>
    <label class="search-box"><svg class="ic"><use href="#i-search"/></svg><input class="search" id="search" type="search" placeholder="Rechercher" aria-label="Rechercher" autocomplete="off"></label>
    <nav class="history" id="history" aria-label="Historique"></nav>
    <div class="side-bottom">
      <button class="install-pwa-btn" id="installAppBtn" title="Installer Makasi AI sur votre téléphone ou PC" aria-label="Installer l'application"><svg class="ic"><use href="#i-download"/></svg><span>Installer l’app</span></button>
      <div class="side-bottom-row">
        <a class="credit" href="https://wa.me/243971404824" target="_blank" rel="noopener noreferrer">Alphonse Design</a>
        <button class="icon-btn" id="themeBtn" aria-label="Changer de thème"><span id="themeIcon"></span></button>
        <button class="icon-btn" id="clearAll" aria-label="Effacer l’historique"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="openSide" aria-label="Ouvrir le menu"><svg class="ic"><use href="#i-menu"/></svg></button>
        <span class="mark"><svg class="ic"><use href="#i-logo"/></svg></span>
        <h1 class="chat-title" id="chatTitle">Makasi AI</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="topInstallBtn" title="Installer Makasi AI sur votre appareil" aria-label="Installer l'application"><svg class="ic"><use href="#i-download"/></svg></button>
        <button class="icon-btn" id="exportChatBtn" title="Exporter la discussion" aria-label="Exporter"><svg class="ic"><use href="#i-export"/></svg></button>
      </div>
    </header>

    <section class="scroll" id="scroll">
      <div class="welcome" id="welcome">
        <h2 id="greeting">Bonjour !</h2>
        <p class="welcome-sub">Comment puis-je vous aider ?</p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
    </section>

    <footer class="composer-wrap">
      <form class="composer" id="form">
        <div class="file-preview-bar" id="filePreviewBar" hidden>
          <span class="file-icon" id="fileIcon"></span>
          <span class="file-name" id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
          <button type="button" class="icon-btn sm" id="removeFileBtn" aria-label="Retirer le fichier"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="voice-status-bar" id="voiceBar" hidden>
          <span class="voice-dot"></span><span id="voiceText"></span>
          <button type="button" class="icon-btn sm" id="cancelVoice" aria-label="Annuler"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <textarea id="input" rows="1" placeholder="Demandez quelque chose à Makasi AI" aria-label="Message" autocomplete="off"></textarea>
        <div class="tools">
          <input type="file" id="fileInput" hidden accept=".txt,.md,.js,.ts,.py,.html,.css,.json,.csv,.sql,.php,.java,.c,.cpp,.pdf,.png,.jpg,.jpeg,.webp">
          <button class="icon-btn" id="attachBtn" type="button" title="Joindre un fichier" aria-label="Joindre un fichier"><svg class="ic"><use href="#i-plus"/></svg></button>
          <button class="icon-btn" id="micBtn" type="button" title="Dictée vocale" aria-label="Dictée vocale"><svg class="ic"><use href="#i-mic"/></svg></button>
          <span class="grow"></span>
          <button class="send" id="send" type="submit" aria-label="Envoyer" disabled><svg class="ic"><use href="#i-up"/></svg></button>
          <button class="send" id="stop" type="button" aria-label="Arrêter" hidden><svg class="ic"><use href="#i-stop"/></svg></button>
        </div>
      </form>
      <p class="composer-footnote">Makasi AI peut faire des erreurs. Vérifiez les informations importantes.</p>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
