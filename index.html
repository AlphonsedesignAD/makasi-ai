<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makasi AI</title>
<meta name="description" content="Makasi AI — Votre assistant intelligent. Aucun compte requis.">
<meta name="theme-color" content="#e0822f">

<!-- Favicon SVG -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e0822f'/%3E%3Cpath d='M8 23V9l8 9 8-9v14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script>
  // Thème avant le rendu pour éviter le flash
  try { var t = localStorage.getItem('makasi.theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
</script>
</head>
<body>

<div class="app" id="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Historique des conversations">
    <div class="side-top">
      <a class="brand" href="./" aria-label="Makasi AI — Accueil">
        <span class="logo">
          <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
            <path d="M8 23V9l8 9 8-9v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Makasi <b>AI</b></span>
      </a>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Nouvelle conversation
    </button>

    <input class="search" id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher une conversation" autocomplete="off">

    <nav class="history" id="history" aria-label="Historique"></nav>

    <div class="side-bottom">
      <button class="ghost" id="themeBtn">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Mode sombre</span>
      </button>
      <button class="ghost danger" id="clearAll">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        Tout effacer
      </button>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSide" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="chat-title" id="chatTitle">Makasi AI</h1>
      <span class="local-badge" title="Vos conversations restent sur cet appareil">🔒 Local</span>
    </header>

    <!-- Messages scroll -->
    <section class="scroll" id="scroll">

      <!-- Welcome screen -->
      <div class="welcome" id="welcome">
        <div class="logo big" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="38" height="38">
            <path d="M8 23V9l8 9 8-9v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 id="greeting">Bonjour</h2>
        <p>Comment puis-je vous aider aujourd'hui&nbsp;?</p>
        <div class="chips" id="chips" role="list"></div>
      </div>

      <!-- Messages list -->
      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

    </section>

    <!-- Composer -->
    <footer class="composer-wrap">
      <form class="composer" id="form" role="search" aria-label="Envoyer un message">
        <textarea
          id="input"
          rows="1"
          placeholder="Écrivez votre message…"
          aria-label="Message à envoyer"
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button class="send" id="send" type="submit" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="send stop" id="stop" type="button" aria-label="Arrêter la génération" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>
          </svg>
        </button>
      </form>
      <p class="disclaimer">Makasi AI peut se tromper. Vérifiez les informations importantes.</p>
    </footer>

  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
